name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Style, static analysis, front-end checks and the test suite.
  # Tests run on SQLite in memory, as phpunit.xml configures, which keeps them
  # fast and independent of any service container.
  ci:
    name: lint, analyse and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          # Matches the version the project is developed on. composer.json
          # allows ^8.3, but pdo_sqlite is what the test suite runs against.
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, zip, bcmath
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build assets
        # Inertia resolves one bundle per page, so a page missing from the Vite
        # manifest is a 500 at runtime. Building here catches that, and the
        # feature tests need the manifest to render pages at all.
        run: npm run build

      - name: Check PHP code style
        run: ./vendor/bin/pint --parallel --test

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Check JS formatting and lint
        run: npm run check

      - name: Check TypeScript types
        run: npm run types:check

      - name: Run tests
        run: php artisan test

  # The application runs on MySQL in production and the migrations use MySQL
  # types (ENUM, DECIMAL, CHAR) that SQLite emulates loosely. This job proves
  # the real schema and the seeders work against the real engine.
  schema:
    name: migrations and seeders on MySQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: aeterna
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, zip, bcmath
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations and seeders
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aeterna
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan migrate:fresh --seed --force

      - name: Verify the migrations roll back cleanly
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aeterna
          DB_USERNAME: root
          DB_PASSWORD: ''
        # A migration whose down() is wrong only shows up when it is run, and
        # the foreign keys here make the order matter.
        run: php artisan migrate:reset --force
